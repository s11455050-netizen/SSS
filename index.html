nter;min-height:66px;transition:transform .15s,border .15s,background .15s}.opt:hover:not(:disabled){transform:translateY(-3px);border-color:var(--cyan);background:#20335a}.opt:disabled{cursor:default}.opt.correct{border-color:#49e0b4;background:#123f43}.opt.wrong{border-color:var(--pink);background:#4b203b;animation:shake .25s}.feedback{display:none;margin-top:16px;border-radius:14px;padding:14px 16px;line-height:1.7;background:#202b4c;border:1px solid #465780}.feedback.show{display:block}.feedback.good{border-color:#39c9a2}.feedback.bad{border-color:#ff6688}.actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:18px}.btn{border:0;border-radius:13px;padding:12px 17px;font:inherit;font-weight:900;cursor:pointer}.primary{color:#07172b;background:linear-gradient(90deg,var(--cyan),#8ff5dc);box-shadow:0 5px 20px #52e6d222}.secondary{color:var(--ink);background:#283456;border:1px solid #43527b}.btn:disabled{opacity:.4;cursor:not-allowed}.hint{color:var(--muted);font-size:13px}.combo{color:var(--gold);font-weight:900;min-height:22px}.start,.end{text-align:center}.start p,.end p{color:var(--muted);line-height:1.8}.start .rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0;text-align:left}.rule{background:#1b2749;border:1px solid #34436e;border-radius:13px;padding:13px;font-size:14px;line-height:1.6}.big{font-size:64px}.review{text-align:left;background:#111a35;border:1px solid #34436e;border-radius:15px;padding:16px;line-height:1.9;margin:20px 0}.footer{text-align:center;color:#8492b8;font-size:12px;margin-top:18px}.flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0;z-index:5}.flash.on{animation:flash .35s}.float{position:fixed;left:50%;top:35%;transform:translate(-50%,-50%);font-size:34px;font-weight:1000;color:var(--gold);text-shadow:0 3px 20px #ffd16688;pointer-events:none;animation:floatup .8s forwards;z-index:8}.life{letter-spacing:2px}.badge{display:inline-block;color:#10172e;background:var(--gold);border-radius:99px;padding:4px 10px;font-weight:900;font-size:12px;margin:3px}@keyframes pulse{to{transform:scale(1.08)}}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}@keyframes flash{20%{opacity:.5}100%{opacity:0}}@keyframes floatup{to{opacity:0;transform:translate(-50%,-130%) scale(1.3)}}@media(max-width:600px){.hud{grid-template-columns:repeat(2,1fr)}.options{grid-template-columns:1fr}.start .rules{grid-template-columns:1fr}.topline{align-items:flex-start}.opt{min-height:56px}}
</style></head><body><div class="flash" id="flash"></div><main class="wrap"><header class="hero"><div class="logo">🧪⚡🕵️</div><h1>酵素小偵探：極限闖關</h1><p class="subtitle">警報響起！實驗室的酵素資料被打亂了。答題、連擊、搶時間，突破溫度與 pH 的考驗，成為酵素王牌偵探！</p></header>
<div class="hud"><div class="hudbox"><small>⚡ 總分</small><b id="score">0</b></div><div class="hudbox"><small>🎯 關卡</small><b id="count">準備中</b></div><div class="hudbox"><small>🔥 連擊</small><b id="combo">0</b></div><div class="hudbox"><small>❤️ 生命值</small><b id="lives" class="life">❤️❤️❤️</b></div></div>
<section class="panel" id="game"><div class="start"><div class="big">🚨</div><span class="badge">任務簡報</span><h2>準備好接受挑戰了嗎？</h2><p>每回合隨機抽出 15 題，題目會重複出現，讓你把重要觀念記牢！<br>每題限時 20 秒，答對得分、連續答對可加成；答錯會扣生命值。</p><div class="rules"><div class="rule">⏱️ <b>限時作答</b><br>20 秒倒數，時間到就算答錯。</div><div class="rule">🔥 <b>連擊加分</b><br>連續答對會獲得額外分數。</div><div class="rule">🧠 <b>學習補給</b><br>每題都有觀念解析，錯了也能學會。</div></div><button class="btn primary" onclick="startGame()">🚀 開始任務</button></div></section><div class="footer">國一自然探究｜酵素基本概念・溫度・酸鹼值 pH｜可離線遊玩</div></main>
<script>
const bank=[
{t:'酵素基本概念',q:'酵素最主要的功能是什麼？',o:['提供生物所有能量','加快化學反應速率','讓反應產生更多原子','把所有物質變成水'],a:1,e:'酵素是生物催化劑，能加快化學反應進行；它不是能量本身。'},
{t:'酵素的專一性',q:'「酵素具有專一性」是什麼意思？',o:['每種酵素都能分解所有物質','酵素只在夜晚工作','酵素通常作用於特定物質或反應','酵素只能在人體內找到'],a:2,e:'不同酵素像不同工具，通常有特定的作用對象或反應。'},
{t:'重複使用',q:'酵素完成一次反應後，通常會怎麼樣？',o:['立刻被消耗殆盡','通常還能再參與反應','一定變成產物','一定永久失去作用'],a:1,e:'酵素通常不會因一次反應就被消耗，因此可以重複參與反應。'},
{t:'溫度大挑戰',q:'溫度太低時，多數酵素的反應速率通常會如何？',o:['變慢','一定變最快','酵素立刻變性','完全不受影響'],a:0,e:'低溫使分子運動較慢，反應速率通常下降；不代表酵素一定被破壞。'},
{t:'溫度大挑戰',q:'溫度過高可能使酵素失去活性，主要原因是什麼？',o:['酵素變成水','酵素的形狀與結構受到破壞','酵素變成氧氣','酵素數量一定增加'],a:1,e:'高溫可能破壞酵素的立體結構，使作用位置改變，稱為變性。'},
{t:'酸鹼值 pH',q:'pH 值主要表示什麼？',o:['液體的酸鹼程度','物體的重量','溫度高低','反應花費的時間'],a:0,e:'pH 用來表示溶液的酸鹼程度。常見水溶液中，pH<7 偏酸、7 中性、>7 偏鹼。'},
{t:'酸鹼值 pH',q:'下列哪個說法正確？',o:['所有酵素都在 pH 7 最好','pH 永遠不影響酵素','不同酵素有各自適合的 pH','所有酵素都適合強酸'],a:2,e:'不同酵素的最佳 pH 不同，例如胃蛋白酶適合酸性環境。'},
{t:'情境推理',q:'新鮮鳳梨加入明膠果凍，果凍不易凝固，主要可能是因為？',o:['鳳梨酵素分解明膠中的蛋白質','鳳梨把光吸走了','酵素讓水消失','果凍不能接觸水果'],a:0,e:'鳳梨酵素能分解蛋白質，而明膠是蛋白質，因此會影響凝固。'},
{t:'情境推理',q:'煮過的鳳梨通常比較不會妨礙果凍凝固，原因是？',o:['煮過後鳳梨沒有水','加熱可能使鳳梨酵素變性','加熱讓酵素變得更多','果凍遇熱就變硬'],a:1,e:'加熱可能使鳳梨酵素的結構改變、失去活性，所以分解明膠的能力下降。'},
{t:'觀念快問快答',q:'酵素在反應中最像哪一種角色？',o:['專用工具或催化幫手','反應的燃料','最後產生的垃圾','溫度計'],a:0,e:'酵素幫助反應更快進行，像專用工具，但自己通常不會因一次反應就被消耗。'},
{t:'觀念快問快答',q:'酵素能加快反應，代表它會讓反應所需的活化能如何？',o:['降低','一定變成零','無限增加','和反應無關'],a:0,e:'酵素可降低反應所需克服的活化能，因此反應較容易進行。'},
{t:'溫度大挑戰',q:'把酵素放在低溫環境，最合理的推論是？',o:['反應通常較慢，但不一定變性','酵素一定被永久破壞','反應一定變快','酵素變成另一種物質'],a:0,e:'低溫通常降低反應速率；與過高溫度造成結構破壞的情況不同。'},
{t:'溫度大挑戰',q:'如果溫度持續升高，酵素活性可能如何變化？',o:['永遠越高越好','先增加至適合範圍，過高可能下降','完全不會改變','一定立刻歸零'],a:1,e:'升溫在一定範圍內可加快反應，但超過適合範圍可能使酵素變性。'},
{t:'酸鹼值 pH',q:'pH 3 的溶液通常屬於哪一類？',o:['酸性','中性','鹼性','無法表示酸鹼'],a:0,e:'常見水溶液中 pH 小於 7 為酸性，pH 3 屬酸性。'},
{t:'酸鹼值 pH',q:'pH 9 的溶液通常屬於哪一類？',o:['酸性','中性','鹼性','一定是純水'],a:2,e:'常見水溶液中 pH 大於 7 為鹼性。'},
{t:'酸鹼值 pH',q:'某酵素在 pH 2 活性最高，最可能適合什麼環境？',o:['強酸性環境','中性環境','鹼性環境','所有環境都一樣'],a:0,e:'pH 2 屬酸性，這種酵素在酸性環境作用較佳。'},
{t:'酵素的專一性',q:'為什麼不能說同一種酵素可以處理所有反應？',o:['酵素通常具有專一性','酵素只能在冰箱裡工作','酵素沒有形狀','所有物質都完全相同'],a:0,e:'酵素的形狀與化學性質會影響它能作用的物質，因此具有專一性。'},
{t:'重複使用',q:'下列何者最符合酵素的特性？',o:['每次反應都一定被用完','可重複參與反應，但環境不適合時可能失活','永遠不會受溫度影響','只會加快一種固定速度的反應'],a:1,e:'酵素通常可重複使用，但溫度或 pH 不適合時，活性可能下降或喪失。'},
{t:'實驗偵探',q:'要公平比較不同溫度對酵素的影響，應該怎麼做？',o:['每組都改變不同條件','只改變溫度，其他條件盡量相同','一組放很多酵素，另一組不放','不記錄實驗結果'],a:1,e:'公平實驗一次改變一個主要因素，其他條件盡量維持相同，才能比較溫度的影響。'},
{t:'實驗偵探',q:'研究 pH 對酵素的影響時，最重要的操作是？',o:['只改變 pH，控制其他條件','每組溫度、酵素量都不同','只看顏色就猜答案','不需要比較結果'],a:0,e:'要檢驗 pH 的影響，就盡量固定溫度、酵素量與作用時間等條件。'},
{t:'觀念快問快答',q:'酵素本身會不會因為催化一次反應就一定被消耗掉？',o:['會，一定消失','不會，通常可再次使用','會，變成酸','只要有水就會消失'],a:1,e:'酵素在反應後通常仍可繼續催化其他反應。'},
{t:'溫度大挑戰',q:'「溫度越高，酵素一定越有活性」這句話正確嗎？',o:['正確，永遠如此','不正確，過高溫可能使酵素變性','只對所有人體酵素正確','只要有水就正確'],a:1,e:'酵素有適合的溫度範圍，過高溫可能破壞其結構，使活性降低。'},
{t:'酸鹼值 pH',q:'若 pH 改變得太多，酵素可能會怎樣？',o:['活性改變，甚至失去作用','一定變成糖','反應必定加倍快','完全不受影響'],a:0,e:'酸鹼值可能影響酵素的形狀與作用能力，極端環境可能讓酵素失活。'},
{t:'終極情境題',q:'胃中的胃蛋白酶能在酸性環境作用，這說明什麼？',o:['每種酵素都有相同最佳 pH','酵素有各自適合的酸鹼環境','酸一定會破壞所有酵素','pH 和酵素無關'],a:1,e:'胃蛋白酶適合胃內酸性環境，說明不同酵素有各自適合的 pH。'},
{t:'終極情境題',q:'唾液澱粉酶主要協助分解哪一類物質？',o:['澱粉','金屬','玻璃','氧氣'],a:0,e:'唾液澱粉酶可協助分解澱粉，這也能看出酵素具有專一性。'},
{t:'觀念快問快答',q:'酵素最適合被描述為？',o:['生物體內的催化劑','一種細菌','一種維生素名稱','所有反應的產物'],a:0,e:'酵素是生物催化劑，能加快特定化學反應。'},
{t:'實驗偵探',q:'實驗發現高溫組酵素反應明顯變慢，哪個解釋最合理？',o:['高溫可能使酵素變性','高溫讓酵素自動變成水','酵素一定用完了','溫度只影響顏色'],a:0,e:'若溫度過高，酵素結構可能被破壞，導致活性降低。'},
{t:'酸鹼值 pH',q:'pH 7 在一般教科書的常見水溶液分類中代表什麼？',o:['中性','強酸','強鹼','一定高溫'],a:0,e:'一般教科書以 pH 7 表示中性，低於 7 偏酸，高於 7 偏鹼。'},
{t:'酵素的專一性',q:'鑰匙與鎖的比喻最常用來說明酵素哪一個特性？',o:['專一性','顏色','重量','能量來源'],a:0,e:'特定形狀的鑰匙較能配合特定的鎖，用來比喻酵素與作用物質的專一性。'},
{t:'終極情境題',q:'小組發現某酵素在 pH 7 活性高、pH 2 活性低，合理結論是？',o:['這個酵素在接近中性的條件下作用較佳','所有酵素都喜歡 pH 7','pH 2 一定是鹼性','這個酵素不能催化反應'],a:0,e:'資料只支持這個酵素在測試條件下較適合接近中性的 pH，不可推論所有酵素都一樣。'}
];
let round=[],idx=0,score=0,combo=0,lives=3,answered=false,timer=null,remaining=20,correctCount=0,missed=[];const $=x=>document.getElementById(x);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startGame(){round=shuffle(bank).slice(0,15);idx=0;score=0;combo=0;lives=3;correctCount=0;missed=[];updateHUD();showQuestion()}
function updateHUD(){$('score').textContent=score;$('count').textContent=round.length?`${Math.min(idx+1,round.length)} / ${round.length}`:'準備中';$('combo').textContent=combo;$('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives)}
function showQuestion(){if(idx>=round.length||lives<=0){finish();return}clearInterval(timer);answered=false;remaining=20;const q=round[idx];$('game').innerHTML=`<div class="topline"><span class="tag">${q.t}</span><span class="timer" id="timer">⏱️ 20 秒</span></div><div class="progress"><div class="bar" id="bar" style="width:${idx/round.length*100}%"></div></div><div class="combo" id="comboMsg">${combo>=2?'🔥 '+combo+' 連擊！繼續保持！':'任務進行中：仔細看題目！'}</div><h2 class="question">${idx+1}. ${q.q}</h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><span class="hint">${idx%5===4?'⚠️ 小心！你正在接近高難度題！':'答對得 100 分，連擊還能加分！'}</span><button class="btn primary" id="next" disabled onclick="nextQuestion()">下一題 →</button></div>`;shuffle(q.o.map((text,original)=>({text,original}))).forEach(item=>{let b=document.createElement('button');b.className='opt';b.textContent=item.text;b.dataset.original=item.original;b.onclick=()=>answer(item.original,b);$('options').appendChild(b)});timer=setInterval(()=>{remaining-- ;let el=$('timer');if(el){el.textContent='⏱️ '+remaining+' 秒';if(remaining<=5)el.classList.add('danger')}if(remaining<=0){clearInterval(timer);if(!answered)answer(-1,null,true)}},1000)}
function pop(text){let el=document.createElement('div');el.className='float';el.textContent=text;document.body.appendChild(el);setTimeout(()=>el.remove(),850)}
function answer(choice,btn,timeout=false){if(answered)return;answered=true;clearInterval(timer);const q=round[idx],good=choice===q.a;const opts=[...$('options').children];opts.forEach(b=>{b.disabled=true;if(q.o.indexOf(b.textContent)===q.a)b.classList.add('correct');if(b===btn&&!good)b.classList.add('wrong')});const f=$('feedback');f.className='feedback show '+(good?'good':'bad');if(good){combo++;correctCount++;let points=100+Math.min(combo-1,5)*20+remaining*2;score+=points;f.innerHTML=`<b>⚡ 命中！+${points} 分${combo>=3?'｜🔥 '+combo+' 連擊':''}</b><br>${q.e}`;pop(combo>=3?'連擊！ +'+points:'+'+points);$('flash').classList.remove('on');void $('flash').offsetWidth;$('flash').classList.add('on')}else{combo=0;lives=Math.max(0,lives-1);missed.push(q);f.innerHTML=`<b>${timeout?'⏰ 時間到！':'💥 這次失誤了！'} 正確答案：${q.o[q.a]}</b><br>${q.e}<br><small>別擔心，解析就是你的補給包！</small>`;pop('-1 ❤️')}updateHUD();$('bar').style.width=((idx+1)/round.length*100)+'%';$('next').disabled=false;$('next').textContent=idx===round.length-1||lives===0?'查看任務結果 🏆':'下一題 →'}
function nextQuestion(){if(!answered)return;idx++;showQuestion()}
function finish(){clearInterval(timer);let pct=Math.round(correctCount/Math.max(1,idx)*100);let rank=score>=1500?'🏆 S級王牌偵探':score>=1000?'🥇 A級酵素專家':score>=600?'🥈 B級研究員':'🧪 見習偵探';$('game').innerHTML=`<div class="end"><div class="big">${lives===0?'🚑':'🏆'}</div><span class="badge">任務結算</span><h2>${rank}</h2><p>總分 <b style="color:var(--gold);font-size:28px">${score}</b> 分｜答對 ${correctCount} 題｜正確率 ${pct}%</p><p>${lives===0?'生命值用完了！讀完解析再來一次，這次一定能撐更久。':pct>=80?'太強了！你已經能破解大部分酵素線索。':'你已經完成任務！多玩幾次、反覆練習，觀念會越來越熟。'}</p><div class="review"><b>🧠 王牌偵探必背筆記</b><br>① 酵素能加快化學反應，通常具有專一性。<br>② 酵素通常不會因一次反應就被消耗，可以重複參與反應。<br>③ 低溫通常讓反應變慢；過高溫可能使酵素變性。<br>④ 不同酵素有各自適合的 pH，並非全部都在 pH 7 最好。<br>⑤ 鳳梨酵素會分解明膠中的蛋白質；加熱可能使酵素失去活性。</div>${missed.length?`<div class="review"><b>🔁 建議再複習的題目（${missed.length} 題）</b><br>${missed.map((q,n)=>`${n+1}. ${q.q}<br><span style="color:var(--muted)">正確觀念：${q.e}</span>`).join('<br><br>')}</div>`:''}<button class="btn primary" onclick="startGame()">🔄 再挑戰一次（重新抽題）</button> <button class="btn secondary" onclick="location.reload()">回到任務簡報</button></div>`;$('count').textContent='完成';$('combo').textContent=combo;$('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives)}
</script></body></html>
